# Streamlit Cloud の「Settings > Secrets」にこの内容を貼り付けて、
# 実際の値に書き換えてください。

THREADS_ACCESS_TOKEN = "your-threads-access-token"
THREADS_USER_ID = "your-threads-user-id"

# Instagramログインのトークン（IGAA...）でも、Facebookログインのトークン（EAA...）でもOK
IG_ACCESS_TOKEN = "your-instagram-access-token"
IG_USER_ID = "your-instagram-business-account-id"

GITHUB_TOKEN = "your-github-personal-access-token"
GITHUB_REPO = "your-name/sns-post-images"
GITHUB_BRANCH = "main"

# Claudeで投稿文を作る機能
ANTHROPIC_API_KEY = "your-anthropic-api-key"
# 使うモデル（任意）。省略時は Haiku（claude-haiku-5-5）
# CLAUDE_TEXT_MODEL = "claude-haiku-5-5"
